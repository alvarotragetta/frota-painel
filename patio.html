<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pátio da manutenção</title>
<meta name="robots" content="noindex,nofollow">

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=ADLaM+Display&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--hd:rgba(9,16,10,.97);--card:#111111;--ink:#f0f0f0;--mut:#8a9a8a;--line:#242424;--ac:#9cff93;--acx:#0a1a06;--cor:#ff4d4d;--pes:#ffb347;--lev:#8af2ff;--ext:#b3a2e0;--neu:#aab4ae;--r:12px;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#eff1ef;--hd:#fff;--card:#fff;--ink:#14201a;--mut:#5d6a62;--line:#d4dad6;--ac:#2f7d1a;--acx:#fff;--cor:#c4411f;--pes:#1f4e79;--lev:#0f766e;--ext:#6a5a8e;--neu:#4b5a52;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "DM Sans",system-ui,sans-serif}
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 32px;background:var(--hd);border-bottom:1px solid var(--line)}
.br{display:flex;align-items:center;gap:16px}
.logo{height:44px;width:auto;display:block}
h1{font:600 16px/1.2 "DM Sans",sans-serif;margin:0}
.sub{display:block;margin-top:4px;font:400 11px "Space Mono",ui-monospace,Consolas,monospace;letter-spacing:.08em;color:var(--mut)}
.tl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font:400 11px "Space Mono",ui-monospace,Consolas,monospace;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 14px;white-space:nowrap}
button.pill{cursor:pointer;color:var(--ink);font:600 12px "DM Sans",sans-serif}
button.pill:hover{border-color:var(--ac)}
#dt{text-transform:capitalize}
.w{max-width:1240px;margin:0 auto;padding:20px 32px 56px}
nav{display:flex;gap:4px;margin:0 0 16px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;width:max-content;max-width:100%;overflow-x:auto}
nav button{font:500 14px "DM Sans",sans-serif;background:none;border:0;color:var(--mut);padding:8px 16px;cursor:pointer;border-radius:8px}
nav button.on{background:var(--ac);color:var(--acx);font-weight:600}
button,input,select{font:inherit;color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.cnt{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:var(--r);padding:10px 16px 10px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;min-width:112px;text-align:left;font:500 11px "Space Mono",ui-monospace,Consolas,monospace;letter-spacing:.06em;color:var(--mut)}
.k b{font:600 32px/1.1 "DM Sans",sans-serif;color:var(--c);letter-spacing:0}
.k.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--ink)}
.add{display:flex;gap:10px;flex-wrap:wrap;align-items:end;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.add label{display:flex;flex-direction:column;font:500 10px "Space Mono",ui-monospace,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);gap:5px}
.add input,.add select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:130px;font:14px "DM Sans",sans-serif}
.add input.wd{width:240px}
.add .p{background:var(--ac);color:var(--acx);border:0;border-radius:8px;font-weight:600;padding:10px 18px;cursor:pointer}
.hint{font:11px "Space Mono",ui-monospace,Consolas,monospace;color:var(--ac);align-self:center}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%}
.tw table{min-width:780px}
th{text-align:left;font:500 10px "Space Mono",ui-monospace,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:12px 14px;border-bottom:1px solid var(--line)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tw tbody tr:last-child td{border-bottom:0}
.tw tbody tr:hover td{background:color-mix(in srgb,var(--ink) 4%,transparent)}
td small{display:block;color:var(--mut);font-size:12px}
.fr{font:600 24px/1 "DM Sans",sans-serif;font-variant-numeric:tabular-nums}
.n{text-align:right;font-variant-numeric:tabular-nums}
.ch{display:inline-block;border:1px solid var(--c);color:var(--c);font:500 10px "Space Mono",ui-monospace,Consolas,monospace;letter-spacing:.06em;padding:3px 8px;border-radius:6px;background:color-mix(in srgb,var(--c) 12%,transparent)}
.w7{color:var(--cor);font-weight:600}
td input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac)}
td select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.ok{font:700 20px "DM Sans",sans-serif;color:var(--ac)}
.row button{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;margin-right:4px;font-size:13px}
.row button:hover{border-color:var(--ac);color:var(--ac)}
.em{padding:56px 24px;text-align:center;color:var(--mut)}
h2{font:600 18px "DM Sans",sans-serif;margin:0 0 12px}
.add textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;font:13px/1.5 "Space Mono",ui-monospace,Consolas,monospace;color:var(--ink);resize:vertical}
.cd{width:100%}.cd label.wf{width:100%;flex:1}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.g{background:none;border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;width:100%}
.add label.it{flex-direction:row;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font:400 13px "DM Sans",sans-serif;text-transform:none;letter-spacing:0;color:var(--ink)}
.it b{font:600 20px "DM Sans",sans-serif}.it small{color:var(--mut)}
.add .it input{width:18px;height:18px;padding:0;border:0;background:none;accent-color:var(--ac)}
.add label.it:has(input:not(:checked)){opacity:.45;border-style:dashed}.cd>div{flex:1}
.mut{color:var(--mut);margin:10px 0 0;font-size:12px}
.sq{margin-left:auto;align-self:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:200px;color:var(--ink);font:14px "DM Sans",sans-serif}
a.pill{text-decoration:none;color:var(--ink);display:inline-block}
.agl{display:flex;gap:6px;flex-wrap:wrap}.agl .ch button{background:none;border:0;color:inherit;cursor:pointer;padding:0 0 0 6px}
/* respiro e hierarquia */
.w{max-width:1280px;padding:32px 40px 80px}
.bar{padding:20px 40px}
nav{margin-bottom:28px}
h2{font-size:22px;margin:0 0 6px}
.lead{color:var(--mut);margin:0 0 26px;font-size:14px;line-height:1.5;max-width:70ch}
.tb{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.lbl{font:500 11px "Space Mono",ui-monospace,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.sq{margin-left:0}
.cnt{gap:12px;margin-bottom:28px}
.cnt .k:nth-child(6){margin-left:14px}
.k{padding:14px 22px 14px 16px;min-width:136px;gap:4px}
.add{padding:24px;gap:18px;margin-bottom:24px}
.add label{gap:8px}
.add input,.add select{padding:11px 12px;width:150px}
.add input.wd{width:280px}
.add .p{padding:12px 24px}
.ft{flex:1 1 100%;display:flex;flex-direction:column;gap:4px}
.ft b{font-size:17px}
td,th{padding:16px}
.fr{font-size:26px}
td small{margin-top:4px;line-height:1.35}
.row button{padding:8px 14px;margin:0 6px 6px 0}
.mut{margin:6px 0 0;line-height:1.5}
.grid{gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.add label.it{padding:12px 14px}
.bt{display:flex;align-items:center;font:600 17px "DM Sans",sans-serif}
.st{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ac);color:var(--acx);font:700 14px "DM Sans",sans-serif;font-style:normal;margin-right:12px}
.btns{margin-top:4px}
.btns .p{background:transparent;color:var(--cor);border:1px solid var(--cor)}
@media(max-width:700px){.w{padding:20px 16px 56px}.bar{padding:16px}.cnt .k:nth-child(6){margin-left:0}}
/* cores com um só significado: vermelho = urgente, amarelo = atenção, verde = ok/ação principal */
.k b{color:var(--ink)}
.k.al{border-left-color:var(--cor)}.k.al b{color:var(--cor)}
.k.on{border-color:var(--ink);background:color-mix(in srgb,var(--ink) 10%,var(--card))}
nav button.on{background:var(--ink);color:var(--bg)}
.pv-vencida td:first-child{box-shadow:inset 4px 0 0 var(--cor)}
.pv-alerta td:first-child{box-shadow:inset 4px 0 0 var(--pes)}
.leg{display:flex;gap:10px 24px;flex-wrap:wrap;margin:0 0 14px;color:var(--mut);font-size:13px}
.leg span{display:flex;align-items:center;gap:8px}.leg .dot{margin:0;width:12px;height:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin:0 6px 0 14px;vertical-align:middle}
.dot:first-child{margin-left:0}
@page{size:A4;margin:8mm}
#pr{display:none}
@media print{body{background:#fff;color:#000}.w,.bar{display:none}#pr{display:block}#pr *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pt{width:100%;min-width:0;border-collapse:collapse;table-layout:fixed;font:700 10pt Calibri,Carlito,"Segoe UI",Arial,sans-serif;color:#000;margin:0}
.pt td,.pt th{padding:1pt 3pt;text-align:center;vertical-align:middle;overflow:hidden;border:1px solid #000}
.pt tr{break-inside:avoid}.pt thead{display:table-header-group}
.pt th{background:#1F497D;color:#fff;font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:7.5pt;letter-spacing:0;height:23pt}
.pt th.h6{font-size:6pt}
.b6{background:#8DB4E2;border:0!important}
.dtx{background:#8DB4E2;color:#1F497D;font:27pt/1 "Arial Black",Arial,sans-serif;text-align:right!important;padding-right:8pt!important;border:0!important}
.nh{background:#1F497D;color:#fff;font:6.5pt "Arial Black",Arial,sans-serif;height:13pt}
.nl{font:700 6.5pt "ADLaM Display",Arial,sans-serif;text-align:left!important;height:13pt}
.nc{font:7.5pt "Arial Black",Arial,sans-serif}
.pb td{height:42pt}
.a6{background:#8DB4E2;font-size:9pt}.f8{background:#C5D9F1;font-size:13pt}.pv{font-size:7pt}.pv.ex{background:#EC8888}.ob{font-size:10.5pt}.km,.dr{text-align:right!important;font-size:10pt}
.lb{width:100%}.lb th.tt{background:#fff;color:#000;border:0;font:21pt "Arial Black",Arial,sans-serif;height:45pt}
.lb th{font-size:16pt;height:30pt}.lb td{height:58pt;font-size:17.6pt}.lb td.fl{background:#8DB4E2;font-size:32pt}.lb td.dup{color:#f00}.lb td.sm{font-size:22pt}.lb td.dl{background:#8DB4E2}
.r2 th.t1{font:17pt "ADLaM Display",Arial,sans-serif;height:86pt;line-height:1.3}.r2 th.t2{font:21pt "ADLaM Display",Arial,sans-serif;height:86pt}
.r2 th.h8{background:#C5D9F1;color:#000;font:13pt "ADLaM Display",Arial,sans-serif;height:43pt}
.r2 td{height:43pt}.r2 td.f2{font-size:15.6pt}.r2 td.bx{font-size:10pt;white-space:pre;line-height:1.35;padding:1pt}}

const fm=x=>(S.f=='TODOS'||(S.f=='SLA'?days(x.c)>=cfg.sla:S.f=='PREV'?pv(x).s=='vencida':x.t==S.f))&&(!S.q||String(x.f).toLowerCase().includes(S.q.toLowerCase()));
function vB(){
 const L=D.b.filter(fm).sort((a,b)=>a.c<b.c?-1:a.c>b.c?1:String(a.f).localeCompare(String(b.f),undefined,{numeric:true}));
 const cnt=['TODOS',...T,'SLA','PREV'].map(t=>`<button class="k ${S.f==t?'on':''} ${(t=='SLA'||t=='PREV')&&cnt1(t)?'al':''}" data-act="f" data-t="${t}" style="--c:${CL[t]}"><b>${cnt1(t)}</b>${LB[t]||t}</button>`).join('');
 const rows=L.map(x=>`<tr class="row pv-${pv(x).s}"><td class="fr">${x.f}</td><td>${fmt(x.c)}<small class="${days(x.c)>=cfg.sla?'w7':''}">${days(x.c)} dia(s) no pátio</small></td><td>${esc(x.m)}<small>${x.v?esc(x.v)+' vagão':''}</small></td><td><span class="ch" style="--c:${CL[x.t]}">${x.t}</span></td><td>${esc(x.o)}</td><td class="n">${x.k?Number(x.k).toLocaleString('pt-BR'):''}</td><td>${fmt(x.p)}</td><td>${fmt(x.l)}</td><td>${pvCell(x)}</td><td>${esc(x.b)}</td><td class="np"><button data-act="edb" data-id="${x.id}">Editar</button><button data-act="lib" data-id="${x.id}">Liberar</button><button data-act="delb" data-id="${x.id}" aria-label="Remover">×</button></td></tr>`).join('');
 return `<h2>Bolsão do pátio</h2><p class="lead np">Carretas no pátio com motivo de manutenção. Registre as chegadas, filtre pelo motivo e libere quando ficarem prontas.</p><div class="tb np"><span class="lbl">Filtrar por motivo ou alerta</span><input id="sq" class="sq" type="search" placeholder="Buscar frota..." value="${esc(S.q)}" aria-label="Buscar frota"></div><div class="cnt np">${cnt}</div>
 <form class="add np" data-form="b"><div class="ft"><b>Registrar chegada</b><span class="mut">Digite a frota: o modelo e o vagão aparecem sozinhos. KM e datas das últimas preventivas ativam o alerta.</span></div>${fld('Frota','f','text','required id="ff"')}
 <label>Motivo<select name="t">${T.map(t=>`<option>${t}</option>`).join('')}</select></label>
 <label>Observação<input class="wd" name="o"></label>${fld('KM','k','number')}${fld('Última pesada','p','date')}${fld('Última leve','l','date')}
 <label>Baú<select name="b"><option></option><option>VAZIO</option><option>CARREG.</option></select></label>
 <button class="p">Registrar chegada</button><span class="hint" id="hint"></span></form>
 <div class="leg np"><span><i class="dot" style="--c:var(--cor)"></i>Vermelho: vencido, ou parado há 10 dias ou mais</span><span><i class="dot" style="--c:var(--pes)"></i>Amarelo: atenção, vence em até 30 dias</span><span><i class="dot" style="--c:var(--ac)"></i>Verde: em dia</span></div><div class="tw"><table><thead><tr><th>Frota</th><th>Chegada</th><th>Modelo</th><th>Motivo</th><th>Observação</th><th class="n">KM</th><th>Últ. pesada</th><th>Últ. leve</th><th>Preventiva</th><th>Baú</th><th class="np"></th></tr></thead><tbody>${rows}</tbody></table>${L.length?'':'<div class="em">Nenhuma carreta aqui. Registre uma chegada acima.</div>'}</div><p class="mut np">Regra da preventiva: pesada a cada 60.000 km ou 1 ano, leve a cada 30.000 km ou 6 meses, com aviso 6.000 km antes. Prazo no pátio: 10 dias.</p>`;
}
function vL(){
 const L=[...D.l].sort((a,b)=>a.d<b.d?-1:1);
 const rows=L.map(x=>{const n=days(x.d);return `<tr class="row"><td class="fr">${x.f}</td><td>${fmt(x.d)}</td><td class="${n>=cfg.sla?'w7':''}">${n} dia(s)</td><td class="np"><button data-act="dell" data-id="${x.id}">Saiu do pátio</button></td></tr>`}).join('');
 return `<h2>Carretas liberadas ${fmt(today())}</h2><p class="lead">Carretas já inspecionadas e liberadas que continuam no pátio. Clique em "Saiu do pátio" quando a operação retirar.</p>
 <form class="add np" data-form="l">${fld('Frota','f','text','required')}${fld('Liberada em','d','date','value="'+today()+'" required')}<button class="p">Adicionar</button></form>
 <div class="tw"><table style="min-width:420px"><thead><tr><th>Frota</th><th>Liberada em</th><th>Dias parados</th><th class="np"></th></tr></thead><tbody>${rows}</tbody></table>${L.length?'':'<div class="em">Nenhuma carreta liberada.</div>'}</div>`;
}
const pf=t=>t.split(/[\s,;]+/).map(x=>x.trim().toUpperCase()).filter(Boolean).map(x=>/^\d+$/.test(x)?+x:x);
function msg(){
 const h=new Date().getHours(),g=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';
 const ag=D.ag.fs,set=new Set(ag.map(String));
 const prev=D.l.filter(x=>!set.has(String(x.f))).sort((a,b)=>cmpF(a.f,b.f));
 const dd=x=>{const k=days(x.d);return k+' '+(k==1?'dia':'dias')};
 return g+' a todos\n\nCarretas liberadas agora:\n\n'+(ag.length?ag.join('\n'):'(nenhuma até agora)')+'\n\n📍 Carretas já liberadas anteriormente e que ainda permanecem no pátio:\n\n'+(prev.length?prev.map(x=>'* '+x.f+' — '+fmt(x.d)+' ('+dd(x)+')').join('\n'):'(nenhuma)');
}
function vR(){
 const m=msg(),dc=D.cf,ex=x=>x.t=='EXTERNO'?1:0,col='style="flex-direction:column;align-items:stretch"';
 const B=[...D.b].sort((a,b)=>ex(a)-ex(b)||cmpF(a.f,b.f)),L=[...D.l].sort((a,b)=>cmpF(a.f,b.f));
 const off=(w,x)=>dc[w][x.id]===false;
 const it=(w,x,e)=>`<label class="it"><input type="checkbox" data-act="cf${w}" data-id="${x.id}" ${off(w,x)?'':'checked'}><b>${esc(x.f)}</b>${e}</label>`;
 const bar=(w,N)=>`<div class="btns"><button type="button" class="g" data-act="cfall" data-w="${w}" data-v="1">Marcar todas</button><button type="button" class="g" data-act="cfall" data-w="${w}" data-v="0">Desmarcar todas</button><button type="button" class="p" data-act="cfap" data-w="${w}">Remover ${N} desmarcada(s)</button></div>`;
 const pend=D.b.filter(x=>x.c==today()&&!x.k);
 return `<h2>Conferência da manhã ${fmt(today())}</h2><p class="lead">Siga as folhas devolvidas pelo líder, na ordem: 1, 2 e 3. No fim, copie a mensagem do WhatsApp.</p>
 <div class="add cd" ${col}><div><b class="bt"><i class="st">1</i>Bolsão de ontem</b><p class="mut">Marque as frotas com caneta (ainda no pátio). As desmarcadas saem do bolsão.</p></div><div class="grid">${B.map(x=>it('b',x,`<span class="ch" style="--c:${CL[x.t]}">${x.t}</span>`)).join('')||'<span class="mut">Bolsão vazio.</span>'}</div>${bar('b',B.filter(x=>off('b',x)).length)}</div>
 <div class="add cd" ${col}><div><b class="bt"><i class="st">2</i>Carretas liberadas</b><p class="mut">Marque as que têm caneta no SIM (ainda no pátio). As desmarcadas saem da lista.</p></div><div class="grid">${L.map(x=>it('l',x,`<small>${fmt(x.d)} · ${days(x.d)}d</small>`)).join('')||'<span class="mut">Lista vazia.</span>'}</div>${bar('l',L.filter(x=>off('l',x)).length)}</div>
 <form class="add cd" data-form="nv"><div style="flex:1 1 100%"><b class="bt"><i class="st">3</i>Carretas novas no pátio</b><p class="mut">Folha "Carretas novas": para cada frota, diga se está liberada ou com problema. Enter registra e volta para a frota.</p></div>
 <label>Frota<input id="fnv" name="f" required autocomplete="off"></label>
 <label>Resultado<select name="r"><option value="L">Liberada / OK</option><option value="P">Com problema</option></select></label>
 <label>Motivo (se problema)<select name="t">${T.map(t=>`<option>${t}</option>`).join('')}</select></label>
 <label>Observação<input class="wd" name="o"></label>
 <label>Baú<select name="b"><option></option><option>VAZIO</option><option>CARREG.</option><option>FECHADO</option><option>PALLET/GAIOLA</option></select></label>
 <button class="p">Registrar</button></form>
 <form class="add cd" data-form="ok"><label class="wf">Ou cole várias frotas liberadas de uma vez<textarea name="f" rows="2" placeholder="Separe por espaço, vírgula ou linha"></textarea></label><button class="p">Liberar estas frotas</button></form>
 ${D.ag.fs.length?`<div class="add cd" ${col}><span class="sub">LIBERADAS AGORA · ${D.ag.fs.length}</span><div class="agl">${D.ag.fs.map(f=>`<span class="ch" style="--c:var(--ac)">${esc(f)}<button type="button" data-act="unag" data-f="${esc(f)}" aria-label="Desfazer">×</button></span>`).join('')}</div></div>`:''}
 ${pend.length?`<div class="add cd" ${col}><span class="sub">FALTAM KM E DATAS DE PREVENTIVA · ${pend.length}</span><div class="agl">${pend.map(x=>`<span class="ch" style="--c:var(--pes)">${esc(x.f)}<button type="button" data-act="edb" data-id="${x.id}">Editar</button></span>`).join('')}</div></div>`:''}
 <div class="add cd" ${col}><div><b class="bt"><i class="st">4</i>Mensagem para o WhatsApp</b><p class="mut">Copie e cole no grupo. Confira o texto antes de enviar.</p></div><label class="wf"><textarea id="wm" aria-label="Mensagem para o WhatsApp" rows="14" readonly>${esc(m)}</textarea></label>
 <div><button class="p" type="button" data-act="cp">Copiar mensagem</button> <a class="pill" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(m)}">Abrir no WhatsApp</a> <span class="hint" id="cph"></span></div></div>`;
}
const cmpF=(a,b)=>typeof a=='number'&&typeof b=='number'?a-b:typeof a=='number'?-1:typeof b=='number'?1:String(a).localeCompare(String(b));
function pB(){
 const ex=x=>x.t=='EXTERNO'?1:0;
 const L=[...D.b].sort((a,b)=>ex(a)-ex(b)||cmpF(a.f,b.f));
 const c=t=>D.b.filter(x=>x.t==t).length;
 const n=new Date(),dt=pad(n.getDate())+'/'+pad(n.getMonth()+1)+'/'+n.getFullYear();
 const cg='<colgroup><col style="width:7.5%"><col style="width:11%"><col style="width:8.7%"><col style="width:44%"><col style="width:10.3%"><col style="width:10%"><col style="width:8.5%"></colgroup>';
 const nec=['CORRETIVA','P.PESADA','EXTERNO','P.LEVE'].map(t=>`<tr><td class="nl">${t}</td><td class="nc">${c(t)}</td></tr>`).join('');
 return `<table class="pt">${cg}<tr><td colspan="3" rowspan="6" class="b6"></td><td colspan="2" rowspan="6" class="dtx">${dt}</td><td colspan="2" class="nh">NECESSIDADE</td></tr>${nec}<tr><td class="nl">TOTAL</td><td class="nc">${D.b.length}</td></tr></table>
 <table class="pt pb">${cg}<thead><tr><th>BAU</th><th>FROTA</th><th class="h6">PREVENTIVA</th><th>OBSERVAÇÃO/PROBLEMAS</th><th>KM</th><th>ULT.PESADA</th><th>ULT.LEVE</th></tr></thead><tbody>${L.map(x=>`<tr><td class="a6">${esc(x.b)}</td><td class="f8">${esc(x.f)}</td><td class="pv ${x.t=='EXTERNO'?'ex':''}">${x.t}</td><td class="ob">${esc(x.o)}</td><td class="km">${x.k?Number(x.k).toLocaleString('pt-BR',{minimumFractionDigits:2}):''}</td><td class="dr">${fmt(x.p)}</td><td class="dr">${fmt(x.l)}</td></tr>`).join('')}</tbody></table>`;
}
function pL(){
 const L=[...D.l].sort((a,b)=>cmpF(a.f,b.f)),q={};D.l.forEach(x=>q[x.f]=(q[x.f]||0)+1);
 const[y,m,d]=today().split('-');
 return `<table class="pt lb"><colgroup><col style="width:32%"><col style="width:33%"><col style="width:18.6%"><col style="width:16.4%"></colgroup><thead><tr><th colspan="4" class="tt">CARRETAS LIBERADAS ${d}/${m}/${y.slice(2)}</th></tr><tr><th>FROTA</th><th>NO PATIO?</th><th>DIA<br>LIBERADA</th><th>DIAS PARADOS</th></tr></thead><tbody>${L.map(x=>`<tr><td class="fl ${q[x.f]>1?'dup':''}">${esc(x.f)}</td><td class="sm">☐ SIM</td><td class="dl">${fmt(x.d)}</td><td>${days(x.d)}</td></tr>`).join('')}</tbody></table>`;
}
function pR(){
 const n=new Date(),dt=pad(n.getDate())+'/'+pad(n.getMonth()+1)+'/'+n.getFullYear();
 const BX='☐FECHADO   ☐PALLET/GAIOLA\n ☐VAZIO     ☐CARREGADO',R=[];
 for(let i=0;i<Math.max(46,D.r.length);i++)R.push(D.r[i]?D.r[i].f:'');
 return `<table class="pt r2"><colgroup><col style="width:18.7%"><col style="width:52.6%"><col style="width:28.7%"></colgroup><thead><tr><th colspan="2" class="t1">CARRETAS NOVAS NO PATIO<br>INSPEÇÃO DIARIA</th><th class="t2">${dt}</th></tr><tr><th class="h8">FROTA</th><th class="h8">OBSERVAÇÃO/PROBLEMAS</th><th class="h8">BAÚ</th></tr></thead><tbody>${R.map(f=>`<tr><td class="f2">${esc(f)}</td><td></td><td class="bx">${BX}</td></tr>`).join('')}</tbody></table>`;
}
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==S.v));
 $('#dt').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
 $('#main').innerHTML=({b:vB,l:vL,r:vR})[S.v]();
 $('#pr').innerHTML=({b:pB,l:pL,r:pR})[S.v]();
 $('#un').hidden=!UNDO;
}
const by=(a,id)=>a.find(x=>String(x.id)==id);
document.querySelector('nav').onclick=e=>{const v=e.target.dataset.v;if(v){S.v=v;S.edit=null;render()}};
const M=$('#main');
M.onclick=e=>{const a=e.target.dataset.act;if(!a)return;const id=e.target.dataset.id;
 if(['lib','delb','dell','delr','unag','cfap'].includes(a))UNDO=JSON.stringify(D);
 if(a=='f'){S.f=e.target.closest('button').dataset.t}
 else if(a=='lib'){const x=by(D.b,id);D.b=D.b.filter(y=>y!==x);D.l.push({id:Date.now(),f:x.f,d:today(),p:false})}
 else if(a=='delb')D.b=D.b.filter(y=>String(y.id)!=id);
 else if(a=='dell')D.l=D.l.filter(y=>String(y.id)!=id);
 else if(a=='delr')D.r=D.r.filter(y=>String(y.id)!=id);
 else if(a=='gob')S.v='b';
 else if(a=='edb'){S.v='b';S.edit=id;render();fillEdit();return}
 else if(a=='cfall'){const w=e.target.dataset.w,v=e.target.dataset.v=='1',src=w=='b'?D.b:D.l,m=D.cf[w];src.forEach(x=>{if(v)delete m[x.id];else m[x.id]=false})}
 else if(a=='cfap'){const w=e.target.dataset.w;if(w=='b')D.b=D.b.filter(x=>D.cf.b[x.id]!==false);else D.l=D.l.filter(x=>D.cf.l[x.id]!==false);D.cf[w]={}}
 else if(a=='unag'){const f=e.target.dataset.f;D.ag.fs=D.ag.fs.filter(x=>String(x)!=f);D.l=D.l.filter(x=>!(String(x.f)==f&&x.d==today()))}
 else if(a=='cp'){const t=$('#wm');t.select();let ok=false;try{ok=document.execCommand('copy')}catch(x){}$('#cph').textContent=ok?'Copiada!':'Texto selecionado: use Ctrl+C';return}
 else if(a=='bol'){S.v='b';render();$('#ff').value=e.target.dataset.f;$('#ff').dispatchEvent(new Event('input'));$('#ff').focus();return}
 else return;
 save();render()};
M.onchange=e=>{const a=e.target.dataset.act,id=e.target.dataset.id;
 if(a=='cfb'||a=='cfl'){const m=D.cf[a=='cfb'?'b':'l'];if(e.target.checked)delete m[id];else m[id]=false}
 else if(a=='pat')by(D.l,id).p=e.target.checked;
 else if(a=='chk')by(D.r,id)[e.target.dataset.k]=e.target.checked;
 else if(a=='sis')by(D.r,id).s=e.target.value;else return;
 save();render()};
M.oninput=e=>{if(e.target.id=='sq'){const v=e.target.value;S.q=v;render();const i=$('#sq');i.focus();i.setSelectionRange(v.length,v.length);return}
 if(e.target.id=='ff'){const f=e.target.value,m=mod(f);$('#hint').textContent=m?m+(SEED.vg[f]?' · '+SEED.vg[f]+' vagão':''):''}};
M.onsubmit=e=>{e.preventDefault();UNDO=JSON.stringify(D);const k=e.target.dataset.form,v=Object.fromEntries(new FormData(e.target)),f=/^\d+$/.test(v.f.trim())?+v.f:v.f.trim().toUpperCase(),id=Date.now();
 if(k=='b'){const e0=S.edit&&D.b.find(y=>String(y.id)==String(S.edit));const o={f,m:mod(f)||(e0&&e0.m)||'',v:SEED.vg[f]||(e0&&e0.v)||'',t:v.t,o:v.o,k:v.k?+v.k:'',p:v.p,l:v.l,b:v.b};if(e0){Object.assign(e0,o);S.edit=null}else D.b.push({id,c:today(),...o})}
 if(k=='l')D.l.push({id,f,d:v.d,p:false});
 if(k=='r')D.r.push({id,f,pn:false,ba:false,fr:false,s:''});
 if(k=='ok')pf(v.f).forEach((x,i)=>{if(D.ag.fs.some(y=>String(y)==String(x)))return;D.b=D.b.filter(y=>String(y.f)!=String(x));D.l=D.l.filter(y=>String(y.f)!=String(x));D.l.push({id:id+i,f:x,d:today(),p:false});D.ag.fs.push(x)});
 if(k=='nv'){D.b=D.b.filter(y=>String(y.f)!=String(f));D.l=D.l.filter(y=>String(y.f)!=String(f));D.ag.fs=D.ag.fs.filter(y=>String(y)!=String(f));
  if(v.r=='L'){D.l.push({id,f,d:today(),p:false});D.ag.fs.push(f)}
  else D.b.push({id,f,c:today(),m:mod(f),v:SEED.vg[f]||'',t:v.t,o:v.o,k:'',p:'',l:'',b:v.b});
  setTimeout(()=>{const i=$('#fnv');if(i)i.focus()},0)}
 save();render()};
let TH='dark';try{TH=localStorage.getItem('patio-th')||'dark'}catch(e){}
const setTh=t=>{TH=t;document.documentElement.dataset.theme=t;$('#tg').textContent=t=='dark'?'🌙 Escuro':'☀️ Claro';try{localStorage.setItem('patio-th',t)}catch(e){}};
$('#un').onclick=()=>{if(UNDO){D=JSON.parse(UNDO);UNDO=null;save();render()}};
$('#tg').onclick=()=>setTh(TH=='dark'?'light':'dark');setTh(TH);
render();
</script></body></html>
